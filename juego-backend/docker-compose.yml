version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: bv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bodegavault
      POSTGRES_USER:     bodega
      POSTGRES_PASSWORD: bodega_secret
    ports:
      - "5432:5432"
    volumes:
      - bv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodega -d bodegavault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bv_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - bv_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bv_pgdata:
  bv_redisdata:
