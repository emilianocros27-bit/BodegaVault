<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodegaVault 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(18, 22, 20, 0.72);
    --text: #f2efe6;
    --muted: #b9b4a5;
    --accent: #3f8f5e;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc3e6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 16px; left: 16px; max-width: 290px;
    background: var(--panel); color: var(--text); backdrop-filter: blur(8px);
    border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.5;
    user-select: none;
  }
  #hud h1 { margin: 0 0 6px; font-size: 15px; letter-spacing: .02em; }
  #hud .keys { color: var(--muted); }
  #hud kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 0 5px; font-family: inherit; color: var(--text); }
  #hud .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #hud button {
    background: rgba(255,255,255,.1); color: var(--text); border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  #hud button:hover { background: var(--accent); border-color: var(--accent); }
  #hud .toggle { position: absolute; top: 10px; right: 12px; padding: 2px 8px; }
  #hud.min .body { display: none; }
  #prompt {
    position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
    background: var(--panel); color: var(--text); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; display: none; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; transition: all .15s; }
  #cross.active { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: transparent; border: 2px solid #ffd84a; box-shadow: 0 0 6px rgba(0,0,0,.5); }
  #topbar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
  #topbar span { white-space: nowrap; background: var(--panel); color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-variant-numeric: tabular-nums; backdrop-filter: blur(8px); }
  #cash { font-weight: 700; color: #ffd84a !important; font-size: 16px !important; transition: transform .2s; }
  #cash.up { animation: pop .5s; } #cash.down { animation: shake .4s; }
  @keyframes pop { 40% { transform: scale(1.18); color: #7dff9e; } }
  @keyframes shake { 25% { transform: translateX(-4px); color: #ff8a7a; } 75% { transform: translateX(4px); } }
  #right { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #loc { background: var(--panel); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; pointer-events: none; }
  #map { width: 180px; height: 210px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); cursor: crosshair; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  #toasts { position: fixed; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
  .toast { background: var(--panel); color: var(--text); padding: 8px 12px; border-radius: 9px; font-size: 13px; backdrop-filter: blur(8px); transition: opacity .5s, transform .5s; border-left: 3px solid #9aa; max-width: 340px; }
  .toast.good { border-left-color: #4fd17f; } .toast.bad { border-left-color: #ff6b5a; }
  .toast.out { opacity: 0; transform: translateX(20px); }
  #speedfx { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(255,255,255,.22) 100%); }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s; }
  #fade.on { opacity: 1; }
  #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); z-index: 10; }
  #modal.show { display: flex; }
  #modal .card { width: min(540px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; background: #1b201d; color: var(--text); border-radius: 14px; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .mhead { display: flex; justify-content: space-between; align-items: center; }
  .mhead h2 { margin: 0; font-size: 18px; }
  #modal h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  #modal .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  #modal .row small { display: block; color: var(--muted); font-size: 12px; }
  #modal .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #modal button { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #modal button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  #modal button:disabled { opacity: .4; cursor: not-allowed; }
  #modal .muted { color: var(--muted); font-size: 13px; } #modal .small { font-size: 12px; }
  body.aerial #cross, body.touring #cross, body.aerial #prompt, body.touring #prompt { display: none !important; }
  body.touring #hud, body.touring #right { opacity: .35; }
  @media (max-width: 700px) {
    #hud { left: 8px; right: 8px; top: 8px; max-width: none; font-size: 12px; }
    #hud .keys { display: none; }
    #topbar { top: auto; bottom: 90px; }
    #right { display: none; }
    #toasts { bottom: 150px; right: 8px; }
    #prompt { bottom: 20px; font-size: 13px; }
  }

  #hud h1 { margin: 0 0 8px; }
  #modal .row .th, .au-item .th { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex: none; background: #24282c; }
  .au-item .th.big { width: 86px; height: 86px; }
  #modal .row .inf { flex: 1; min-width: 0; }
  #modal .row .inf b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rar, .cond { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-right: 4px; font-weight: 600; }
  .rar { color: var(--rc); background: color-mix(in srgb, var(--rc) 18%, transparent); border: 1px solid color-mix(in srgb, var(--rc) 50%, transparent); }
  .cond { color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); }
  #modal .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  #modal .card { background: #23282b; border-radius: 12px; padding: 8px; border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); display: flex; flex-direction: column; gap: 3px; }
  #modal .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; }
  #modal .card b { font-size: 12px; line-height: 1.25; }
  #modal .card small { color: var(--muted); font-size: 11px; }
  /* subastas */
  #auction { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); background: rgba(22,18,14,.92); color: var(--text); border-radius: 16px; border: 1px solid rgba(201,164,65,.45); box-shadow: 0 20px 60px rgba(0,0,0,.5); display: none; flex-direction: column; z-index: 9; backdrop-filter: blur(10px); }
  #auction.show { display: flex; }
  .au-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(201,164,65,.3); font-weight: 700; color: #e8cf8a; }
  .au-head button { background: none; border: 0; color: var(--text); font-size: 16px; cursor: pointer; }
  #auBody { padding: 12px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  #auBody .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  #auBody .row .th { width: 48px; height: 48px; border-radius: 8px; }
  #auBody .row .inf { flex: 1; min-width: 0; } #auBody .row small, .au-item small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #auBody button { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #auBody button:hover:not(:disabled) { background: #b08a2a; border-color: #b08a2a; color: #1a1206; }
  #auBody button:disabled { opacity: .4; }
  #auBody .acts { display: flex; gap: 8px; justify-content: flex-end; }
  #auBody .muted { color: var(--muted); } #auBody .small { font-size: 12px; }
  .au-item { display: flex; gap: 12px; align-items: center; }
  .au-lbl { margin-top: 4px; } #auStart { width: 100%; accent-color: #c9a441; }
  .au-bid { text-align: center; padding: 8px 0 2px; }
  .au-bid span { display: block; font: 700 40px Georgia, serif; color: #fff; font-variant-numeric: tabular-nums; }
  .au-bid small { color: #9fe0a8; font-size: 13px; }
  .au-timer { height: 6px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
  .au-timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff6a3a, #ffcf4a); transition: width .1s linear; }
  .au-call { text-align: center; font: 700 20px Georgia, serif; color: #ffcf4a; min-height: 24px; }
  .au-feed { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .au-feed div { background: rgba(255,255,255,.05); border-radius: 8px; padding: 6px 8px; }
  .au-feed div:first-child { background: rgba(201,164,65,.18); }
  /* teléfono */
  #phone { position: fixed; right: 28px; bottom: 20px; width: 290px; height: min(600px, calc(100vh - 40px)); transform: translateY(115%) rotate(4deg); transition: transform .38s cubic-bezier(.2,.9,.25,1.1); z-index: 8; pointer-events: none; }
  #phone.show { transform: translateY(0) rotate(0); pointer-events: auto; }
  .ph-frame { height: 100%; border-radius: 46px; padding: 10px; background: linear-gradient(145deg, #3a3d42, #111214 60%, #2a2c30); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #55595e, inset 0 0 0 4px #0c0c0e; }
  .ph-screen { position: relative; height: 100%; border-radius: 37px; overflow: hidden; padding: 12px 16px 16px; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 20% 0%, #ff8a5c 0%, transparent 55%), radial-gradient(120% 90% at 100% 30%, #7b4dff 0%, transparent 60%), linear-gradient(180deg, #1c2a6b, #0b0f24); color: #fff; }
  .ph-status { display: flex; justify-content: space-between; align-items: center; font: 600 13px system-ui; height: 26px; }
  .ph-island { width: 86px; height: 24px; background: #000; border-radius: 14px; }
  .ph-icons { display: flex; gap: 5px; align-items: center; font-size: 11px; }
  .ph-icons .sig { width: 14px; height: 10px; background: linear-gradient(90deg, #fff 0 20%, transparent 20% 27%, #fff 27% 47%, transparent 47% 54%, #fff 54% 74%, transparent 74% 81%, #fff 81%); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .ph-icons .bat { width: 22px; height: 10px; border: 1.5px solid #fff; border-radius: 3px; position: relative; background: linear-gradient(90deg, #fff 70%, transparent 70%) content-box; padding: 1px; }
  .ph-hero { text-align: center; margin: 22px 0 18px; }
  .ph-big { font: 700 44px system-ui; letter-spacing: -.02em; text-shadow: 0 4px 20px rgba(0,0,0,.3); }
  .ph-sub { font-size: 12px; opacity: .8; }
  .ph-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; }
  .ph-grid button, .ph-dock button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: transform .12s; }
  .ph-grid button svg, .ph-dock button svg { width: 48px; height: 48px; padding: 11px; box-sizing: border-box; border-radius: 14px; background: linear-gradient(160deg, var(--a), var(--b)); fill: #fff; stroke: none; box-shadow: 0 6px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35); }
  .ph-grid button span { font-size: 10px; text-shadow: 0 1px 3px rgba(0,0,0,.5); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-grid button:hover, .ph-dock button:hover { transform: translateY(-2px); }
  .ph-grid button.tap, .ph-dock button.tap { transform: scale(.88); }
  .ph-dock { margin-top: auto; display: flex; justify-content: space-around; padding: 10px 6px; border-radius: 26px; background: rgba(255,255,255,.18); backdrop-filter: blur(14px); }
  .ph-home { width: 110px; height: 5px; background: rgba(255,255,255,.85); border-radius: 3px; margin: 10px auto 0; }
  @media (max-width: 700px) { #phone { right: 50%; transform: translate(50%, 115%); width: 260px; } #phone.show { transform: translate(50%, 0); } }

  #goal { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; background: linear-gradient(135deg, rgba(31,111,120,.92), rgba(15,70,78,.92)); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; box-shadow: 0 8px 22px rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.15); }
  #goal b { color: #f2d06a; font-weight: 600; }
  .pcard.offer { border-left: 4px solid #bf5af2; }
  .odds { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .odds i { font-style: normal; font-size: 10px; padding: 1px 5px; border-radius: 5px; color: var(--rc); background: color-mix(in srgb, var(--rc) 16%, transparent); }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 12.5px; }
  .kv b { font-variant-numeric: tabular-nums; }
  #lvlChip { display: flex; align-items: center; gap: 8px; }
  #lvlChip .lb { display: inline-block; width: 60px; height: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #lvlBar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffcc4d, #ff9f0a); }
  .ph-home-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .ph-grid button, .ph-dock button { position: relative; }
  .badge { position: absolute; top: -4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #ff3b30; color: #fff; font: 700 10px/16px system-ui; font-style: normal; text-align: center; }
  .ph-app { flex: 1; min-height: 0; flex-direction: column; margin: 4px -16px -6px; background: #0f1115; border-radius: 22px 22px 0 0; }
  .ph-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: linear-gradient(160deg, var(--a), var(--b)); border-radius: 22px 22px 0 0; }
  .ph-bar b { font-size: 15px; }
  #phBack { all: unset; cursor: pointer; font-size: 26px; line-height: 20px; width: 28px; }
  #phBody { flex: 1; overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; scrollbar-width: thin; }
  #phBody h4 { margin: 8px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9a9aa2; }
  #phBody small { display: block; color: #a9a9b2; font-size: 11px; margin-top: 2px; }
  #phBody .muted { color: #8a8a92; }
  #phBody .up { color: #4fd17f; } #phBody .dn { color: #ff6b5a; }
  #phBody button { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 9px 10px; border-radius: 12px; background: #1d2027; color: #eee; font-size: 12.5px; }
  #phBody button:hover:not([disabled]) { background: #272b34; }
  #phBody button[disabled] { opacity: .4; cursor: not-allowed; }
  #phBody button.primary { background: linear-gradient(160deg, var(--a), var(--b)); color: #fff; font-weight: 700; }
  #phBody button.danger { background: #3a1216; color: #ff8a80; }
  #phBody input[type=range] { width: 100%; accent-color: var(--a); }
  #phBody label { font-size: 12px; }
  .pcard { background: #1a1d24; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .pcard.hero { background: linear-gradient(160deg, color-mix(in srgb, var(--a) 35%, #1a1d24), #1a1d24); }
  .pcard .big { font: 800 26px system-ui; letter-spacing: -.02em; }
  .pcard.tier { border-left: 4px solid var(--tb); }
  .pcard.tier.locked { opacity: .75; }
  .pcard.mini { padding: 7px 10px; } .pcard.mini.done { border-left: 3px solid #4fd17f; }
  .pcard .trow { display: flex; justify-content: space-between; font-size: 13px; }
  .pcard .price { font: 800 20px system-ui; margin-top: 4px; }
  .pcard.item, .pcard .item { display: flex; gap: 10px; align-items: flex-start; flex-direction: row; }
  .pcard img, .li img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: #24282c; }
  .pcard .bigimg { width: 100%; height: auto; aspect-ratio: 1; }
  .pcard.news b { font-size: 13.5px; }
  .pbar { height: 6px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .pbar i { display: block; height: 100%; border-radius: 4px; }
  .bid { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.06); gap: 8px; }
  .tabs { display: flex; gap: 6px; } .tabs.wrap { flex-wrap: wrap; }
  .tabs button { flex: 1; padding: 7px 6px !important; font-size: 11.5px !important; }
  .tabs button.on { background: linear-gradient(160deg, var(--a), var(--b)) !important; color: #fff; font-weight: 700; }
  #phBody .li { display: flex !important; gap: 10px; align-items: center; text-align: left !important; }
  #phBody .li span { flex: 1; min-width: 0; } #phBody .li b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .ico { width: 36px; height: 36px; flex: none !important; display: grid; place-items: center; font-size: 20px; border-radius: 10px; background: #252a33; }
  .li .ico.av { background: linear-gradient(160deg, var(--a), var(--b)); font-weight: 800; color: #fff; }
  #phBody .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #phBody .cell { display: flex; flex-direction: column; gap: 3px; padding: 5px !important; border-radius: 10px; background: #1a1d24; border: 1px solid color-mix(in srgb, var(--rc, #444) 60%, transparent); color: #ddd; text-decoration: none; }
  #phBody .cell img { width: 100%; aspect-ratio: 1; border-radius: 7px; object-fit: cover; }
  #phBody .cell small { font-size: 9.5px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #cfcfd6; }
  #phBody .cell.unk .q { aspect-ratio: 1; display: grid; place-items: center; font: 800 26px system-ui; color: #555; background: #13151a; border-radius: 7px; }
  .achs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ach { text-align: center; padding: 6px 2px; border-radius: 10px; background: #15171c; filter: grayscale(1); opacity: .45; }
  .ach.on { filter: none; opacity: 1; background: #22262e; }
  .ach span { font-size: 20px; } .ach small { font-size: 8.5px !important; line-height: 1.15; }
  .msg { display: flex; gap: 10px; background: #1a1d24; border-radius: 12px; padding: 8px 10px; }
  .msg .ico { font-size: 18px; } .msg .t { font-size: 10px !important; color: #6a6a72 !important; }
  #phMap { width: 100%; border-radius: 12px; cursor: crosshair; }

  body, button, input { font-family: 'Rubik', system-ui, sans-serif; }
  #topbar span { border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  #cash { font-family: 'Bebas Neue', 'Rubik', sans-serif !important; font-size: 24px !important; letter-spacing: .03em; padding: 5px 14px !important; }
  #lvl { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: .04em; font-weight: 400; }
  /* notificaciones */
  #toasts { right: 18px; bottom: 26px; gap: 8px; }
  .note { display: flex; align-items: center; gap: 12px; min-width: 250px; max-width: 360px; padding: 10px 14px 10px 10px; border-radius: 16px; color: #f4f1ea;
    background: linear-gradient(135deg, rgba(28,30,36,.94), rgba(16,17,21,.94)); backdrop-filter: blur(12px); box-shadow: 0 14px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
    animation: noteIn .45s cubic-bezier(.2,1.2,.3,1); transition: opacity .45s, transform .45s; }
  .note.out { opacity: 0; transform: translateX(30px) scale(.96); }
  @keyframes noteIn { from { opacity: 0; transform: translateX(40px) scale(.9); } }
  .note .ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-size: 18px; font-weight: 800; color: #fff; background: linear-gradient(145deg, #4a5160, #2a2e38); }
  .note div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .note b { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .note span { font-size: 12px; color: #a9a9b4; margin-top: 2px; }
  .note em { font-style: normal; font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: .02em; }

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { setEnvMap, C as MK, artTex, labelTex as mkLabel } from './js/modelkit.js';
import { buildItem } from './js/models.js';
import { guitar } from './js/models-music.js';
import { makeCar as carModel } from './js/cars.js';
import { clutterUnit, trashCan, trashBagMesh, waterCooler } from './js/props.js';
import { createForest, makeBush, grassField, flowerPatch, flowerField, leafyPlant, agaveMesh, cactusMesh, nopalMesh } from './js/vegetation.js';
import { buildHouseInterior, HOUSE_WALL_TEX, HOUSE_FLOOR_TEX } from './js/house.js';
import { buildStore, buildCafe } from './js/store.js';
import { LOT_Z, STREET, BACK_ROAD, lotFrame, buildSideWild, buildSideOpen, buildEmptyLot, buildConstruction, buildBackRoad, buildTerminalWild } from './js/town.js';
import * as TB from './js/town-buildings.js';
import * as TERM from './js/terminal.js';
import * as CARS from './js/cars.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { chandelier } from './js/models-tech.js';
import { humanoid } from './js/models-collect.js';
import { CATALOG, RARITIES, CONDITIONS, CATEGORIES, BODEGA_TIERS, NPCS } from './js/catalog.js';

// ---------- Dimensiones (metros) ----------
const N = 10;          // bodegas por edificio
const W = 3.6;         // ancho de cada bodega
const D = 6.0;         // fondo
const H = 3.1;         // alto de muros
const DW = 2.9;        // ancho de puerta
const DH = 2.55;       // alto de puerta
const T = 0.1;         // grosor de lámina
const AISLE = 9;       // ancho del pasillo
const L = N * W;
const EYE = 1.7, RADIUS = 0.3;

// ---------- Renderer / escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
const MAX_PR = Math.min(devicePixelRatio, 1.75);
let curPR = MAX_PR;
renderer.setPixelRatio(curPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9dcec, 70, 320);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 1000);
camera.rotation.order = 'YXZ';

// ---------- Texturas procedurales ----------
function canvasTex(size, draw, repeatWrap = true) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeatWrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function rgb(hex) { return [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255]; }

// lámina corrugada vertical (1 m = 256 px, costilla cada 25 cm)
function corrugated(hex) {
  const [r, g, b] = rgb(hex);
  return canvasTex(256, (ctx, s) => {
    for (let x = 0; x < s; x++) {
      const k = 0.82 + 0.18 * Math.cos((x / 64) * Math.PI * 2) + (x % 64 < 3 ? -0.12 : 0);
      ctx.fillStyle = `rgb(${r * k | 0},${g * k | 0},${b * k | 0})`;
      ctx.fillRect(x, 0, 1, s);
    }
    for (let i = 0; i < 900; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.04})`;
      ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2);
    }
  });
}
// cortina enrollable: listones horizontales
function slats(hex) {
  const [r, g, b] = rgb(hex);
  return canvasTex(256, (ctx, s) => {
    for (let y = 0; y < s; y++) {
      const p = y % 22;
      const k = p < 2 ? 0.55 : 0.85 + 0.15 * Math.sin((p / 22) * Math.PI);
      ctx.fillStyle = `rgb(${r * k | 0},${g * k | 0},${b * k | 0})`;
      ctx.fillRect(0, y, s, 1);
    }
  });
}
function noise(base, spread, size = 256, dots = 9000) {
  const [r, g, b] = rgb(base);
  return canvasTex(size, (ctx, s) => {
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < dots; i++) {
      const k = 1 + (Math.random() - 0.5) * spread;
      ctx.fillStyle = `rgb(${r * k | 0},${g * k | 0},${b * k | 0})`;
      ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
  });
}

const texBeige = corrugated(0xc4b58d);
const texGalv = corrugated(0xa7abad);
const texGreen = slats(0x2f6b4c);
const texAsphalt = noise(0x4f5256, 0.35, 512, 40000); texAsphalt.repeat.set(1 / 4, 1 / 4);
const texConcrete = noise(0xa19d95, 0.18, 256, 6000); texConcrete.repeat.set(1 / 2, 1 / 2);
const texGrass = noise(0x5c7f3a, 0.45, 256, 12000); texGrass.repeat.set(80, 80);

// ---------- Materiales ----------
const M = {
  beige: new THREE.MeshStandardMaterial({ map: texBeige, roughness: 0.6, metalness: 0.25 }),
  galv: new THREE.MeshStandardMaterial({ map: texGalv, roughness: 0.45, metalness: 0.45 }),
  trim: new THREE.MeshStandardMaterial({ color: 0xb3a47c, roughness: 0.5, metalness: 0.3 }),
  roof: new THREE.MeshStandardMaterial({ color: 0xd8cfb4, roughness: 0.55, metalness: 0.3 }),
  concrete: new THREE.MeshStandardMaterial({ map: texConcrete, roughness: 0.95 }),
  drum: new THREE.MeshStandardMaterial({ color: 0x2a5a40, roughness: 0.5, metalness: 0.4 }),
  handle: new THREE.MeshStandardMaterial({ color: 0x888c8f, roughness: 0.3, metalness: 0.8 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2cf, emissiveIntensity: 1.6 }),
};

// Box con UVs en metros (la textura se repite por tamaño real)
function boxGeo(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++)
    for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]);
    }
  return g;
}
const colliderMeshes = [];
function box(parent, w, h, d, mat, x, y, z, collide = false) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  if (collide) colliderMeshes.push(m);
  return m;
}

function labelTex(text) {
  return canvasTex(256, (ctx, s) => {
    ctx.fillStyle = '#ece5cf'; ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = '#6d6450'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, s - 10, s - 10);
    ctx.fillStyle = '#2b2a26'; ctx.font = 'bold 120px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, s / 2, s / 2 + 6);
  }, false);
}

// ---------- Edificios ----------
const units = [];

function building(prefix, gx, rotY) {
  const g = new THREE.Group();
  g.position.x = gx;
  g.rotation.y = rotY;
  scene.add(g);

  // losa de concreto
  const slab = box(g, D + 0.7, 0.12, L + 0.5, M.concrete, -D / 2 + 0.15, 0.06, 0);
  slab.castShadow = false;
  // muro trasero
  box(g, T, H, L + T, M.beige, -D - T / 2, H / 2, 0, true);
  // techo (arriba beige, abajo galvanizado)
  const roofMats = [M.trim, M.trim, M.roof, M.galv, M.trim, M.trim];
  const roof = new THREE.Mesh(boxGeo(D + 1.1, 0.16, L + 0.9), roofMats);
  roof.position.set(-D / 2 + 0.25, H + 0.08, 0);
  roof.castShadow = roof.receiveShadow = true;
  g.add(roof);
  // faldón frontal
  box(g, 0.08, 0.34, L + 0.9, M.roof, 0.8, H + 0.02, 0);

  const pw = (W - DW) / 2;
  for (let i = 0; i <= N; i++) {
    const z = -L / 2 + i * W;
    const end = i === 0 || i === N;
    // divisiones entre bodegas (interior galvanizado)
    box(g, D, H, T, end ? M.beige : M.galv, -D / 2, H / 2, z, true);
    // poste/moldura frontal
    box(g, 0.16, H, 0.24, M.trim, 0.02, H / 2, z, true);
  }

  for (let i = 0; i < N; i++) {
    const zs = -L / 2 + i * W;
    const zc = zs + W / 2;
    // jambas y dintel
    box(g, T, H, pw, M.beige, -T / 2, H / 2, zs + pw / 2, true);
    box(g, T, H, pw, M.beige, -T / 2, H / 2, zs + W - pw / 2, true);
    box(g, T, H - DH, DW, M.beige, -T / 2, DH + (H - DH) / 2, zc);

    // cortina enrollable
    const tex = texGreen.clone();
    tex.needsUpdate = true;
    const door = new THREE.Mesh(boxGeo(0.05, 1, DW - 0.04), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5, metalness: 0.35 }));
    door.position.set(-0.14, DH / 2, zc);
    door.castShadow = door.receiveShadow = true;
    g.add(door);
    const doorBox = new THREE.Box3();
    const handle = box(g, 0.06, 0.05, 0.5, M.handle, -0.1, 0.2, zc);
    // tambor (rollo) arriba por dentro
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, DW, 24), M.drum);
    drum.rotation.x = Math.PI / 2;
    drum.position.set(-0.32, DH + 0.2, zc);
    drum.castShadow = true;
    g.add(drum);

    // número de bodega
    const name = `${prefix}-${String(i + 1).padStart(2, '0')}`;
    const lab = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.34), new THREE.MeshStandardMaterial({ map: labelTex(name), roughness: 0.8 }));
    lab.rotation.y = Math.PI / 2;
    lab.position.set(0.005, DH + (H - DH) / 2, zc);
    g.add(lab);

    // lámpara de techo interior
    box(g, 0.6, 0.05, 0.18, M.lamp, -D / 2, H - 0.03, zc).castShadow = false;

    units.push({
      name, group: g, door, tex, handle, drum, doorBox,
      open: 1, target: 1,
      local: { zc },
      front: new THREE.Vector3(), inside: new THREE.Vector3(),
    });
  }
  return g;
}

function texWH(w, h, draw, repeat = false) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function tiled(t, s) { t.repeat.set(s, s); return t; }
function mat(o) { return new THREE.MeshStandardMaterial(o); }

// muro con huecos (puertas/ventanas). along='z': muro en x=fixed que corre en z; along='x': en z=fixed
function wall(g, along, fixed, a0, a1, base, h, holes, m, t = 0.2) {
  const seg = (s0, s1, y0, y1) => {
    if (s1 - s0 < 0.001 || y1 - y0 < 0.001) return;
    const len = s1 - s0, c = (s0 + s1) / 2, hh = y1 - y0, cy = base + y0 + hh / 2;
    if (along === 'z') box(g, t, hh, len, m, fixed, cy, c, true);
    else box(g, len, hh, t, m, c, cy, fixed, true);
  };
  let cur = a0;
  for (const o of [...holes].sort((p, q) => p.a0 - q.a0)) {
    seg(cur, o.a0, 0, h);
    seg(o.a0, o.a1, 0, o.y0);
    seg(o.a0, o.a1, o.y1, h);
    cur = o.a1;
  }
  seg(cur, a1, 0, h);
}
function decal(parent, tex, w, h, x, y, z, ry, o = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat({
    map: tex, transparent: !!o.transparent, alphaTest: o.alphaTest ?? 0, roughness: o.roughness ?? 0.8,
    emissive: o.emissive ? 0xffffff : 0x000000, emissiveMap: o.emissive ? tex : null, emissiveIntensity: o.emissive ?? 0,
    side: o.double ? THREE.DoubleSide : THREE.FrontSide, depthWrite: !o.transparent,
  }));
  m.position.set(x, y, z);
  m.rotation.y = ry;
  if (o.rx) m.rotation.x = o.rx;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(parent, rt, rb, h, m, x, y, z, seg = 16, collide = false) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  c.position.set(x, y, z);
  c.castShadow = c.receiveShadow = true;
  parent.add(c);
  if (collide) colliderMeshes.push(c);
  return c;
}
function rod(parent, a, b, r, m) {
  const v = new THREE.Vector3().subVectors(b, a);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, v.length(), 8), m);
  c.position.copy(a).addScaledVector(v, 0.5);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.normalize());
  c.castShadow = true;
  parent.add(c);
  return c;
}
// vidrio + marco en muro que corre en z (x fijo) o en x (z fijo)
function glassZ(g, x, a0, a1, y0, y1, m) { const p = box(g, 0.03, y1 - y0, a1 - a0, m, x, (y0 + y1) / 2, (a0 + a1) / 2); p.castShadow = false; return p; }
function glassX(g, z, a0, a1, y0, y1, m) { const p = box(g, a1 - a0, y1 - y0, 0.03, m, (a0 + a1) / 2, (y0 + y1) / 2, z); p.castShadow = false; return p; }
function frameZ(g, x, a0, a1, y0, y1, m, t = 0.06) {
  const w = a1 - a0, hh = y1 - y0, zc = (a0 + a1) / 2, yc = (y0 + y1) / 2;
  box(g, 0.08, t, w + t * 2, m, x, y1 + t / 2, zc);

}
function frameX(g, z, a0, a1, y0, y1, m, t = 0.06) {
  const w = a1 - a0, hh = y1 - y0, xc = (a0 + a1) / 2, yc = (y0 + y1) / 2;

const sizeCache = {};
function itemSize(it) {
  if (!sizeCache[it.id]) { const m = buildItem(it.id, it.seed); bbox.setFromObject(m); sizeCache[it.id] = bbox.getSize(new THREE.Vector3()); disposeTree(m); }
  return sizeCache[it.id];
}
const priceTex = n => mkLabel(fmt(n), { bg: '#f2b134', fg: '#1a1206', w: 256, h: 88, font: 'bold 58px Rubik, system-ui' });
function refreshStoreDisplay() {
  disposeTree(storeItemsG); storeItemsG.clear();
  for (const [sid, d] of Object.entries(state.store.display)) {
    const s = storeSlots.find(x => x.id === sid); if (!s) continue;
    const m = buildItem(d.item.id, d.item.seed); applyCondition(m, d.item.condition);
    bbox.setFromObject(m); bbox.getSize(bsize);
    const k = Math.min(1, s.w / Math.max(bsize.x, bsize.z, 0.01), s.h / Math.max(bsize.y, 0.01));
    m.scale.multiplyScalar(k);
    const h = new THREE.Group(); h.add(m); h.position.set(s.x, s.y - bbox.min.y * k, s.z); h.rotation.y = s.ry;
    storeItemsG.add(h);
    const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.076), mat({ map: priceTex(d.price), roughness: 0.6 }));
    const off = s.w >= 1 ? 0.52 : 0.2;
    tag.rotation.order = 'YXZ'; tag.rotation.set(-0.7, s.ry, 0);
    tag.position.set(s.x + Math.sin(s.ry) * off, s.y + 0.03, s.z + Math.cos(s.ry) * off);
    storeItemsG.add(tag);
  }
}
const freeSlots = () => storeSlots.filter(s => !state.store.display[s.id]);
function bestSlot(it) {
  const sz = itemSize(it); let best = null, bk = -1e9;
  for (const s of freeSlots()) {
    let k = Math.min(1, s.w / Math.max(sz.x, sz.z, 0.01), s.h / Math.max(sz.y, 0.01));
    if (s.lux) k += RANK[it.rarity] >= 2 ? 0.6 : -0.6;
    k -= s.w * s.h * 0.02;
    if (k > bk) { bk = k; best = s; }
  }
  return best;
}
const defaultPrice = (it, s) => Math.max(10, Math.round(it.value * (s?.lux ? 1.4 : 1.2) / 5) * 5);
function exhibit(uid) {
  const it = state.inv.find(x => x.uid === uid); if (!it) return;
  const s = bestSlot(it);
  if (!s) { sfx.error(); return toast('No hay espacio libre · construye más muebles', 'bad'); }
  state.inv = state.inv.filter(x => x !== it);
  state.store.display[s.id] = { item: it, price: defaultPrice(it, s), since: gameNow() };
  refreshStoreDisplay(); refreshHouseDisplay(); sfx.pick(); save();
}
function unexhibit(sid) {
  const d = state.store.display[sid]; if (!d) return;
  if (state.inv.length >= capacity()) { sfx.error(); return toast('Inventario lleno', 'bad'); }
  delete state.store.display[sid]; state.inv.push(d.item);
  refreshStoreDisplay(); refreshHouseDisplay(); save();
}
function setPrice(sid, k) {
  const d = state.store.display[sid]; if (!d) return;
  d.price = Math.max(10, Math.round((d.price + k * d.item.value) / 5) * 5);
  refreshStoreDisplay(); save();
}

// ---- probabilidades del bazar ----
function storeStats() {
  const TM = { letrero: 1.25, piso: 1.15, estacionamiento: 1.2, plaza: 1.3, espectacular: 1.5 };
  let traffic = 1.6; const mults = [];
  for (const k in TM) if (has(k)) { traffic *= TM[k]; mults.push(`${STAGES.find(x => x.id === k).name} ×${TM[k]}`); }
  const repK = 0.6 + state.store.rep / 100; traffic *= repK;
  const nb = bizOwned().length; if (nb) { traffic *= 1 + 0.03 * nb; mults.push(`Negocios del barrio (${nb}) ×${(1 + 0.03 * nb).toFixed(2)}`); }
  let special = 0.05; if (has('plaza')) special *= 1.6; if (has('lujo')) special *= 1.5; if (has('espectacular')) special *= 1.3;
  return {
    traffic, repK, mults, special,
    buyBase: 0.45 + (has('piso') ? 0.05 : 0) + (has('clima') ? 0.08 : 0),
    pivot: 1.2 + (has('piso') ? 0.05 : 0) + (has('clima') ? 0.05 : 0) + (has('espectacular') ? 0.05 : 0),
    theft: has('camaras') ? 0.003 : 0.015,
  };
}
const trendBuy = cat => (cat === state.trends?.hot ? 1.3 : cat === state.trends?.cold ? 0.7 : 1);
function buyChance(sid, st = storeStats()) {
  const d = state.store.display[sid], s = storeSlots.find(x => x.id === sid);
  const r = d.price / Math.max(1, d.item.value);
  let p = st.buyBase / (1 + Math.exp((r - st.pivot - (s?.lux ? 0.2 : 0)) * 7)) * trendBuy(d.item.category);
  if (d.item.condition === 'broken') p *= 0.3;
  return Math.min(0.95, p);
}

// ---- clientes (sin NPCs 3D: llegan por probabilidad y te enteras por notificación) ----
function storeSale(sid, who, special) {

  const it = d.item;

  addCash(d.price, `Bazar: ${it.name}`, 'tienda');

}
function customerVisit(st) {
  const S = state.store; S.today.visits++;
  const ids = Object.keys(S.display);
  if (!ids.length) { S.rep = Math.max(0, S.rep - 0.15); return; }
  if (Math.random() < st.theft) {
    const cheap = ids.filter(id => S.display[id].item.value < 2000).sort((a, b) => S.display[a].item.value - S.display[b].item.value);
    if (cheap.length) {
      const d = S.display[cheap[0]]; delete S.display[cheap[0]];
      note({ kind: 'bad', icon: '🦹', title: '¡Te robaron en el bazar!', body: `Se llevaron ${d.item.name} (~${fmt(d.item.value)})${has('camaras') ? '' : ' · unas cámaras ayudarían'}` });
      notify('Robo en El Bazar', `${d.item.name} · ~${fmt(d.item.value)}`, '🦹', true);

  const npc = npcs[(Math.random() * npcs.length) | 0];
  const cats = npc.preferredCategories;
  const cand = Object.keys(state.store.display).filter(id => !cats.length || cats.includes(state.store.display[id].item.category)).sort((a, b) => state.store.display[b].item.value - state.store.display[a].item.value);
  if (cand.length) {
    const d = state.store.display[cand[0]], mult = npc.categoryMultipliers[d.item.category] ?? 1;
    const max = d.item.value * mult * rnd(1.1, 1.5);
    if (d.price <= max) return storeSale(cand[0], npc.name, true);
    return createOffer(npc, d.item, Math.round(max / 5) * 5, 'special', `Pasé a tu bazar y vi tu ${d.item.name}. En ${fmt(d.price)} está caro, pero te doy esto:`);
  }
  if (state.requests.length < 3 && Math.random() < 0.6) {
    const cat = cats.length ? cats[(Math.random() * cats.length) | 0] : CAT_KEYS[(Math.random() * CAT_KEYS.length) | 0];
    const minRank = state.level < 4 ? 1 : state.level < 9 ? (Math.random() < 0.6 ? 1 : 2) : (Math.random() < 0.5 ? 2 : 3);
    const r = { id: state.nextOfferId++, npc: npc.id, cat, minRank, mult: +rnd(1.35, 1.8).toFixed(2), due: state.day + 3 };
    state.requests.push(r);

    notify(`${npc.name} dejó un encargo`, `Busca ${CATEGORIES[cat].name} ${RARITIES[rn].name.toLowerCase()} o mejor. Te paga ${r.mult}× su valor si lo consigues antes del día ${r.due}.`, '📋');
  }
}
function storeTick(dh) {
  if (!storeOpen()) return;
  const st = storeStats();
  if (Math.random() < st.traffic * dh) customerVisit(st);
  if (Math.random() < st.special * dh) specialVisit();
}

// ---- ofertas por mensaje: los NPC te escriben si les interesa algo tuyo ----
function findOwned(uid) {
  const it = state.inv.find(x => x.uid === uid); if (it) return { it, where: 'inv' };
  for (const [sid, d] of Object.entries(state.store.display)) if (d.item.uid === uid) return { it: d.item, where: 'store', sid };
  return null;
}
function removeOwned(o) {
  if (o.where === 'inv') state.inv = state.inv.filter(x => x !== o.it); else delete state.store.display[o.sid];
  refreshStoreDisplay(); refreshHouseDisplay();
}
function createOffer(npc, it, price, kind, text) {
  if (state.offers.some(o => o.uid === it.uid)) return;
  const o = { id: state.nextOfferId++, npc: npc.id, uid: it.uid, price: Math.max(10, price), max: price * rnd(1.0, 1.4), exp: gameNow() + (kind === 'request' ? 8 : 5), text: text || npc.buyPhrases[(Math.random() * npc.buyPhrases.length) | 0], kind, countered: false };
  state.offers.unshift(o);

  updateBadges(); save();
}
function interestOffer(it) {
  const w = {};
  for (const n of NPCS) { if (n.id === 'misterioso' && Math.random() > 0.1) continue; w[n.id] = (n.categoryMultipliers[it.category] ?? 0.9) * (n.preferredCategories.includes(it.category) ? 3 : 1); }
  const npc = npcById(weighted(w));
  const mult = (npc.categoryMultipliers[it.category] ?? 0.9) * (npc.gradeBonusThreshold && it.grade >= npc.gradeBonusThreshold ? 1.2 : 1);
  createOffer(npc, it, Math.round(it.value * mult * trendMult(it.category) * rnd(0.8, 1.12) / 5) * 5, 'interest');
}
function offersTick(dh) {
  const now = gameNow();
  const before = state.offers.length;
  state.offers = state.offers.filter(o => {
    if (!findOwned(o.uid)) return false;
    if (now > o.exp) { notify(`${npcById(o.npc)?.name ?? 'Un comprador'} retiró su oferta`, 'No contestaste a tiempo', '⌛', true); return false; }
    return true;
  });
  if (state.offers.length !== before) updateBadges();
  // encargos cumplidos: si ya tienes algo que busca un cliente, te escribe
  for (const r of [...state.requests]) {
    const own = [...state.inv, ...Object.values(state.store.display).map(d => d.item)].find(it => it.category === r.cat && RANK[it.rarity] >= r.minRank && it.condition !== 'broken' && !state.offers.some(o => o.uid === it.uid));
    if (own) { state.requests = state.requests.filter(x => x !== r); createOffer(npcById(r.npc), own, Math.round(own.value * r.mult / 5) * 5, 'request', `¡Supe que conseguiste ${own.name}! Justo lo que te encargué.`); }
  }
  if (state.offers.length >= 5) return;
  const owned = [...state.inv.map(it => [it, 1]), ...Object.values(state.store.display).map(d => [d.item, 1.4])];
  for (const [it, k] of owned) {
    if (it.condition === 'broken' || state.offers.some(o => o.uid === it.uid)) continue;
    const lam = 0.01 * (RAR_INTEREST[it.rarity] ?? 1) * k * (it.category === state.trends?.hot ? 1.6 : it.category === state.trends?.cold ? 0.5 : 1);

}
const acceptP = k => Math.max(0, Math.min(1, (1.4 - k) / 0.4));   // el máximo oculto del comprador es oferta × U(1.0, 1.4)
function acceptOffer(o) {
  const own = findOwned(o.uid), npc = npcById(o.npc);
  state.offers = state.offers.filter(x => x !== o);
  if (!own) return;
  const it = own.it;
  if (it.pirated) {
    if (own.where === 'store') { delete state.store.display[own.sid]; state.inv.push(it); refreshStoreDisplay(); }
    if (policeCheck(it, 'contact')) return;

  state.stats.sold++;

  addCash(o.price, `Venta a ${npc.name}: ${it.name}`, 'venta');

}

  else note({ kind: 'warn', icon: '💬', title: `${npc.name}: “Lo más que doy es ${fmt(o.price)}”`, body: 'Su oferta sigue en Mensajes' });
  updateBadges(); save();
}
function offerCard(o) {

  const it = own.it, left = Math.max(0, o.exp - gameNow());

    <div class="tabs"><button class="primary" data-ph="offAcc" data-v="${o.id}">Aceptar</button><button data-ph="offRej" data-v="${o.id}">Rechazar</button></div>

// ---- plataformas de construcción (estilo tycoon) ----
const padsG = new THREE.Group(); scene.add(padsG);
let pads = [], padHold = 0, padOn = null;
const PAD_COL = { ok: 0x35e07a, cash: 0xffc83a, level: 0xff5a4a };
const padBaseGeo = new THREE.CylinderGeometry(0.72, 0.76, 0.08, 40), padFillGeo = new THREE.CircleGeometry(0.62, 40), padBeamGeo = new THREE.CylinderGeometry(0.66, 0.66, 2.4, 40, 1, true);
padFillGeo.rotateX(-Math.PI / 2); padBeamGeo.translate(0, 1.2, 0);
const beamTex = texWH(8, 128, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,1)'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
function padStatus(st) { return state.level < st.level ? 'level' : state.cash < st.cost ? 'cash' : 'ok'; }
function padLabelTex(st, status) {
  return texWH(512, 230, (c, w, h) => {
    c.fillStyle = 'rgba(12,18,20,0.86)'; c.beginPath(); c.roundRect(6, 6, w - 12, h - 12, 28); c.fill();
    c.strokeStyle = '#' + PAD_COL[status].toString(16).padStart(6, '0'); c.lineWidth = 6; c.stroke();
    c.textAlign = 'center'; c.fillStyle = '#ffffff'; c.font = '600 34px Rubik, system-ui';
    const words = st.name.split(' '); let line = '', lines = [];
    for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (c.measureText(t).width > w - 60) { lines.push(line); line = wd; } else line = t; }
    lines.push(line); lines = lines.slice(0, 2);
    lines.forEach((l, i) => c.fillText(l, w / 2, 58 + i * 40 - (lines.length - 1) * 12));
    c.font = '400 76px "Bebas Neue", Rubik, system-ui'; c.fillStyle = c.strokeStyle; c.fillText(fmt(st.cost), w / 2, 168);
    c.font = '500 24px Rubik, system-ui'; c.fillStyle = '#cfd6d8';
    c.fillText(status === 'level' ? `🔒 Requiere nivel ${st.level}` : status === 'cash' ? 'Junta el dinero y vuelve' : 'Párate encima para construir', w / 2, 206);
  });
}
function refreshPads() {
  for (const p of pads) { p.lab.material.map.dispose(); p.lab.material.dispose(); }
  padsG.clear(); pads = [];
  const entries = [...STAGES.filter(stageAvail).map(st => ({ ...st, key: st.id, build: () => buildStageNow(st) })), ...townPadEntries()];
  for (const st of entries) {
    const status = padStatus(st), col = PAD_COL[status];
    const g = new THREE.Group(); g.position.set(st.pad[0], 0.02, st.pad[1]);
    const base = new THREE.Mesh(padBaseGeo, new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.6, roughness: 0.4 })); base.position.y = 0.04; base.receiveShadow = true;
    const fill = new THREE.Mesh(padFillGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })); fill.position.y = 0.09; fill.scale.setScalar(0.001);
    const beam = new THREE.Mesh(padBeamGeo, new THREE.MeshBasicMaterial({ color: col, map: beamTex, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
    const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: padLabelTex(st, status), transparent: true, depthWrite: false }));
    lab.scale.set(2.3, 1.03, 1); lab.position.y = 2.6;
    g.add(base, fill, beam, lab); padsG.add(g);

  }
}
function updatePads(dt, t) {
  let on = null;
  for (const p of pads) {
    const s = padStatus(p.st);
    if (s !== p.status) { p.status = s; const c = PAD_COL[s]; p.base.material.color.setHex(c); p.base.material.emissive.setHex(c); p.beam.material.color.setHex(c); p.lab.material.map.dispose(); p.lab.material.map = padLabelTex(p.st, s); }
    p.lab.position.y = 2.6 + Math.sin(t * 2 + p.pos.x) * 0.08;
    p.beam.material.opacity = 0.25 + 0.12 * Math.sin(t * 3 + p.pos.z);
    if (!aerial && !touring && Math.hypot(player.x - p.pos.x, player.z - p.pos.z) < 0.72) on = p;
  }
  if (on !== padOn) { if (padOn) padOn.fill.scale.setScalar(0.001); padOn = on; padHold = 0; }
  if (on && on.status === 'ok' && !uiBusy()) {
    padHold += dt; on.fill.scale.setScalar(Math.max(0.001, Math.min(1, padHold / 1.1)));
    if (padHold >= 1.1) { padHold = -99; on.st.build(); }
  }
  for (let i = buildAnims.length - 1; i >= 0; i--) {
    const a = buildAnims[i]; a.t += dt / 1.2;
    const e = a.t >= 1 ? 1 : 1 - Math.pow(1 - a.t, 3) * Math.cos(a.t * 9) * (1 - a.t) - Math.pow(1 - a.t, 3);
    a.p.scale.y = Math.max(0.001, Math.min(1.04, e));
    if (a.t >= 1) { a.p.scale.y = 1; buildAnims.splice(i, 1); }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const f = puffs[i]; f.life += dt;
    f.sp.position.addScaledVector(f.v, dt); f.v.multiplyScalar(1 - dt * 1.5);
    f.sp.scale.multiplyScalar(1 + dt * 0.6); f.sp.material.opacity = 0.8 * (1 - f.life / f.max);
    if (f.life >= f.max) { scene.remove(f.sp); f.sp.material.dispose(); puffs.splice(i, 1); }
  }
}
function buildStageNow(st) {
  if (has(st.id) || !stageAvail(st)) return;
  if (state.level < st.level) { sfx.error(); return toast(`🔒 ${st.name} · requiere nivel ${st.level}`, 'bad'); }
  if (state.cash < st.cost) { sfx.error(); return toast(`Te faltan ${fmt(st.cost - state.cash)} · para ${st.name}`, 'bad'); }
  addCash(-st.cost, `Obra: ${st.name}`, 'obra');
  state.store.built[st.id] = true;
  rebuildStore(st.id);
  refreshPads();
  sfx.build();
  banner(st.name.toUpperCase(), st.desc, 'house');
  addXP(Math.round(st.cost / 25));
  if (st.id === 'mostrador') notify('¡Abriste El Bazar!', 'Habla en el mostrador para exhibir objetos. Los clientes llegan solos, según la probabilidad.', '🏪');
  if (STAGES.every(x => has(x.id))) setTimeout(() => banner('¡DUEÑO DEL BARRIO!', 'Construiste todo el bazar y el poblado'), 3200);

}
function updateGoal() {

  const el = $('goal'); if (!el) return;
  el.innerHTML = next ? `🎯 Siguiente obra: <b>${next.name}</b> · ${fmt(next.cost)}${state.level < next.level ? ` · nivel ${next.level}` : ''}` : '🏆 ¡Tu bazar y el barrio están completos!';
}

  // rescate: si te quedaste sin nada, el banco te da un apoyo para volver a empezar

  if (storeOpen()) { const td = state.store.today; notify(`Tu bazar ayer: ${td.sales} ventas · ${fmt(td.sum)}`, `${td.visits} clientes entraron · reputación ${Math.round(state.store.rep)}/100`, '🏪', true); }
  state.store.today = { visits: 0, sales: 0, sum: 0 };

  state.containers = state.containers.filter(c => c.bought ? ((c.contents?.items?.length ?? 0) + (c.contents?.cars?.length ?? 0)) > 0 || state.day <= c.day + 1 : state.day <= c.day + 2);
  if (state.containers.length !== before) refreshContainers();
  state.requests = state.requests.filter(r => { if (state.day > r.due) { notify(`${npcById(r.npc)?.name} ya no busca ${CATEGORIES[r.cat].name}`, 'El encargo venció', '⌛', true); return false; } return true; });
  state.pawned = state.pawned.filter(p => { if (state.day > p.due) { notify(`Se remató tu ${p.item.name}`, 'No pagaste ni refrendaste a tiempo', '🏷️'); state.shopStock.push({ ...p.item, remate: true }); return false; } return true; });

}

function thumb(item) {
  const key = item.id + ':' + item.seed;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const m = buildItem(item.id, item.seed);
  thumbScene.add(m);
  bbox.setFromObject(m); const c = bbox.getCenter(new THREE.Vector3()), sz = bbox.getSize(new THREE.Vector3());
  const r = Math.max(sz.x, sz.y, sz.z) * 0.62;
  thumbCam.position.set(c.x + r * 1.5, c.y + r * 1.0, c.z + r * 2.4); thumbCam.lookAt(c);
  const S = 160, dpr = renderer.getPixelRatio();

  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, S / dpr, S / dpr); renderer.setScissor(0, 0, S / dpr, S / dpr);
  renderer.render(thumbScene, thumbCam);
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  cv.getContext('2d').drawImage(renderer.domElement, 0, renderer.domElement.height - S, S, S, 0, 0, S, S);
  renderer.setScissorTest(false);

const BOT_NAMES = ['coleccionista_mx', 'RetroRicky', 'la_abuela_vintage', 'DonPedroAntigüedades', 'TianguisPro', 'vinilo_lover', 'GamerOG_77', 'numismatica_gdl', 'ArtDeco_Sofi', 'reventa_express', 'el_chacharero', 'CasaMoncada', 'Tito_Relojes', 'MusicaVieja', 'jugueteria_1985', 'Sr_Oro', 'PinturaYPincel', 'deportes_clasicos'];
const CAT_KEYS = Object.keys(CATEGORIES);
function makeBidders(it, n) {
  const list = [];
  for (const npc of NPCS) {
    if (npc.id === 'misterioso' && Math.random() > 0.12) continue;
    const mult = npc.categoryMultipliers[it.category] ?? (npc.preferredCategories.length ? 0.85 : 0.95);
    list.push({ name: npc.name, max: it.value * mult * (npc.gradeBonusThreshold && it.grade >= npc.gradeBonusThreshold ? 1.3 : 1) * rnd(0.72, 1.12) });
  }
  const pool = [...BOT_NAMES].sort(() => Math.random() - 0.5);
  for (let i = 0; i < n; i++) {
    const likes = CAT_KEYS[(Math.random() * CAT_KEYS.length) | 0];
    list.push({ name: pool[i], max: it.value * (likes === it.category ? 1.2 : 0.9) * rnd(0.55, 1.12) });
  }
  const k = trendMult(it.category) * (1 + HOUSE[state.house - 1].bonus);
  list.forEach(b => (b.max = Math.round(b.max * k)));
  return list;
}
const incFor = (v) => v < 200 ? 10 : v < 1000 ? 25 : v < 5000 ? 100 : v < 20000 ? 250 : v < 100000 ? 1000 : 5000;
const AUCTION_DUR = [[1, 'Relámpago · 1 h', 2], [3, 'Normal · 3 h', 5], [6, 'Larga · 6 h', 9]];
const maxAuctions = () => 1 + state.house;
function createAuction(uid, start, durIdx) {
  const it = state.inv.find(x => x.uid === uid); if (!it) return;
  if (state.auctions.filter(a => a.status === 'live').length >= maxAuctions()) return toast(`Máximo ${maxAuctions()} subastas a la vez (mejora tu casa para más)`, 'bad');
  const [h, , nb] = AUCTION_DUR[durIdx];
  const now = gameNow();
  state.inv = state.inv.filter(x => x.uid !== uid);
  const a = { id: state.nextAuctionId++, item: it, start, endsAt: now + h, dur: h, bids: [], status: 'live', bidders: makeBidders(it, nb), nextAt: now + rnd(0.08, 0.3) };

  state.auctions = state.auctions.slice(0, 30);

  notify(`Subasta publicada`, `${it.name} · salida ${fmt(start)}`, '🔨', true);
  save();
}
function auctionsTick() {
  const now = gameNow();
  for (const a of state.auctions) {
    if (a.status !== 'live') continue;
    while (a.nextAt <= Math.min(now, a.endsAt)) {
      const cur = a.bids[0]?.amount ?? 0, next = cur ? cur + incFor(cur) : a.start;
      const leader = a.bids[0]?.name;
      const cands = a.bidders.filter(b => b.name !== leader && b.max >= next);
      if (cands.length) {
        const b = cands[(Math.random() * cands.length) | 0];
        const jump = Math.random() < 0.18 ? incFor(next) * (1 + ((Math.random() * 3) | 0)) : 0;
        const amount = Math.min(b.max, next + jump);
        a.bids.unshift({ name: b.name, amount, t: clockStr() });
        if (a.endsAt - a.nextAt < 0.2) a.endsAt += 0.2; // anti-francotirador
        if (Math.random() < 0.35) notify(`Nueva puja: ${fmt(amount)}`, `${b.name} en ${a.item.name}`, '🔨', !phoneOpen || phoneApp !== 'auctions' ? false : true);
        sfx.bid();
        a.nextAt += rnd(0.05, a.dur / 7);
      } else a.nextAt += 0.25;
      if (!cands.length && a.nextAt > a.endsAt) break;
    }
    if (now >= a.endsAt) {
      if (a.bids.length) {
        a.status = 'sold';
        const top = a.bids[0], net = Math.round(top.amount * (1 - AUCTION_FEE));
        if (a.item.pirated) { state.inv.push(a.item); if (policeCheck(a.item, 'auction')) { a.status = 'seized'; save(); continue; } state.inv = state.inv.filter(x => x.uid !== a.item.uid); }
        state.stats.sold++; state.stats.auctions++;
        addCash(net, `Subasta: ${a.item.name} (${top.name})`, 'subasta');
        addXP(Math.round(net / 18));
        notify(`¡Vendido! ${a.item.name}`, `${top.name} pagó ${fmt(top.amount)} · recibes ${fmt(net)}`, '💰');
        sfx.cash();
      } else {
        a.status = 'unsold';
        state.inv.push(a.item);
        refreshHouseDisplay();
        notify(`Sin ofertas: ${a.item.name}`, 'El objeto regresó a tu inventario', '📦');
      }
      checkAchievements();
      save();
      if (phoneOpen) renderApp();
    }
  }
}

function contactOffer(npcId, uid) {
  const npc = NPCS.find(n => n.id === npcId), it = state.inv.find(x => x.uid === uid);
  if (!npc || !it) return null;
  if (npc.id === 'misterioso' && Math.random() < 0.75) return { none: true, text: '…no contesta.' };
  let mult = npc.categoryMultipliers[it.category] ?? (npc.preferredCategories.length ? 0.8 : 0.9);
  if (npc.gradeBonusThreshold && it.grade >= npc.gradeBonusThreshold) mult *= 1.25;
  const price = Math.round(it.value * mult * trendMult(it.category) * rnd(0.72, 0.98) / 5) * 5;
  return { price, text: npc.buyPhrases[(Math.random() * npc.buyPhrases.length) | 0] };
}

const dynBoxes = [];
function collide() {

  for (const c of unitCols.values()) boxes.push(...c);

    for (const b of boxes) {

      const cx = Math.max(b.min.x, Math.min(player.x, b.max.x));
      const cz = Math.max(b.min.z, Math.min(player.z, b.max.z));
