<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prueba · Central de contenedores</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb6c9; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; top: 10px; left: 10px; background: rgba(15,17,20,.8); color: #eee; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  #info a { color: #ffd479; margin-right: 8px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">
  <div><a href="?what=container">contenedor</a><a href="?what=containers">muestrario</a><a href="?what=truck">camión</a><a href="?what=terminal">terminal</a><a href="?what=dealer&level=1">agencia 1</a><a href="?what=dealer&level=2">2</a><a href="?what=dealer&level=3">3</a></div>
  <div id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { setEnvMap } from './js/modelkit.js';
import { CONTAINER_BRANDS, containerMesh, truckMesh, buildTerminal, buildDealership } from './js/terminal.js';

const Q = new URLSearchParams(location.search);
const what = Q.get('what') || 'container';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c3d8);
scene.fog = new THREE.Fog(0xa9c3d8, 120, 400);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
setEnvMap(env);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6b5f50, 1.0));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.position.set(30, 45, 22); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
const big = what === 'terminal' || what === 'containers';
Object.assign(sun.shadow.camera, { left: big ? -60 : -16, right: big ? 60 : 16, top: big ? 60 : 16, bottom: big ? -60 : -16, far: 200 });
scene.add(sun); scene.add(sun.target);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x7d7a72, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

function human(x, z) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xff5a2a, roughness: 0.6 });
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.75 - 0.44, 6, 16), m); b.position.y = 1.75 / 2; b.castShadow = true; g.add(b);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), new THREE.MeshStandardMaterial({ color: 0x111111 })); eye.position.set(0.2, 1.7, 0); g.add(eye);
  g.position.set(x, 0, z); scene.add(g); return g;
}
let obj = null, anim = null;
const T = { THREE, scene, camera, controls, renderer };
window.T = T;
if (what === 'container') {
  const b = Q.get('brand') || 'marea', size = Q.get('size') || '20', seed = +(Q.get('seed') || 3);
  obj = containerMesh(b, Q.get('color') ? parseInt(Q.get('color'), 16) : null, size, seed);
  scene.add(obj);
  const open = +(Q.get('open') ?? 0.6); obj.userData.setDoors(open);
  human(obj.userData.length / 2 + 1.5, 1.6);
  camera.position.set(obj.userData.length * 0.9, 2.2, 6.5); controls.target.set(0, 1.3, 0);
  T.obj = obj;
} else if (what === 'containers') {
  let i = 0;
  CONTAINER_BRANDS.forEach((b, bi) => b.colors.forEach((c, ci) => {
    const size = ci % 3 === 2 ? '40' : ci % 3 === 1 ? '40HC' : '20';
    const m = containerMesh(b.id, c, size, 10 + i++);
    m.position.set(bi * 16 - 16, 0, ci * 3.4 - 9); scene.add(m);
    if (ci === 0) m.userData.setDoors(1);
  }));
  human(0, 12);
  camera.position.set(30, 14, 26); controls.target.set(0, 1, 0);
} else if (what === 'truck') {
  obj = truckMesh(Q.get('color') ? parseInt(Q.get('color'), 16) : 0xb0182a);
  scene.add(obj);
  if (Q.get('load')) {
    const c = containerMesh('solmar', 0xd9621e, '40', 4);
    c.position.set(obj.userData.cargoX, obj.userData.cargoY, 0); obj.add(c);
  }
  if (Q.get('load2')) {
    for (const [k, x] of obj.userData.cargoX20.entries()) { const c = containerMesh(k ? 'halcon' : 'marea', null, '20', 5 + k); c.position.set(x, obj.userData.cargoY, 0); obj.add(c); }
  }
  human(8, 2.5);
  camera.position.set(14, 4, 12); controls.target.set(2, 1.6, 0);
  T.obj = obj;
} else if (what === 'terminal') {
  const t = buildTerminal(); obj = t.group; scene.add(obj); T.t = t;
  const hm = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
  for (const s of t.slots) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.25), hm); d.position.set(s.x, 0.3, s.z); if (Q.get('dbg')) scene.add(d); }
  if (Q.get('dbg')) { const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(t.truckPath.map(p => p.clone().setY(0.3))), new THREE.LineBasicMaterial({ color: 0xff00ff })); scene.add(line); }
  human(t.pts.office.x, t.pts.office.z);
  if (Q.get('truck')) {
    const tr = truckMesh(0x1d4f8c); const p = t.pts.unload; tr.position.set(p.x, 0, p.z); tr.rotation.y = p.ry; scene.add(tr);
    const c = containerMesh('halcon', null, '40', 9); c.position.set(tr.userData.cargoX, tr.userData.cargoY, 0); tr.add(c);
  }
  camera.position.set(55, 40, 45); controls.target.set(0, 0, -24);
} else if (what === 'dealer') {
  const d = buildDealership(+(Q.get('level') || 1)); obj = d.group; scene.add(obj); T.d = d;
  const hm = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
  if (Q.get('dbg')) for (const s of d.slots) { const a = new THREE.ArrowHelper(new THREE.Vector3(Math.cos(s.ry), 0, -Math.sin(s.ry)), new THREE.Vector3(s.x, 0.4, s.z), 2.5, 0x00ff66); scene.add(a); }
  if (Q.get('cars')) {
    import('./js/cars.js').then(({ makeCar }) => { d.slots.forEach((s, i) => { const car = makeCar(['sedan', 'pickup', 'vocho'][i % 3], [0xb0182a, 0x1d4f8c, 0xe8e4da, 0x222222, 0x2e6a3c][i % 5]); car.position.set(s.x, s.y || 0, s.z); car.rotation.y = s.ry; scene.add(car); }); });
  }
  human(d.pts.office.x, d.pts.office.z);
  camera.position.set(22, 14, 22); controls.target.set(0, 1, -12);
}
const cp = Q.get('cam');
if (cp) { const [a, b, c, d, e, f] = cp.split(',').map(Number); camera.position.set(a, b, c); controls.target.set(d, e, f); }
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const stats = document.getElementById('stats');
let fr = 0;
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (++fr % 30 === 0) stats.textContent = `draw calls ${renderer.info.render.calls} · tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k · tex ${renderer.info.memory.textures} · geo ${renderer.info.memory.geometries}`;
});
</script>
</body>
</html>
