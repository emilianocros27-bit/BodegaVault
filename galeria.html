<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galería de objetos</title>
<style>
  :root { --bg: #16181a; --panel: rgba(20,22,24,.85); --text: #eee9dc; --muted: #a9a394; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); padding: 10px 12px; border-radius: 12px; }
  #bar select, #bar input { background: #25282b; color: var(--text); border: 1px solid #3a3e42; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
  #bar b { font-size: 14px; }
  #count { color: var(--muted); font-size: 13px; margin-left: auto; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); padding: 8px 10px; border-radius: 8px; font-size: 13px; display: none; max-width: 260px; }
  #tip small { display: block; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <b>Galería BodegaVault</b>
  <select id="cat"></select>
  <input id="q" placeholder="Buscar…" />
  <span id="count"></span>
</div>
<div id="tip"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { setEnvMap } from './js/modelkit.js';
import { buildItem, EXTRA_SHOWCASE } from './js/models.js';
import { CATALOG, CATEGORIES, RARITIES } from './js/catalog.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2023);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
setEnvMap(env);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
scene.add(sun);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2d30, roughness: 0.9 });
const all = [...CATALOG.map(c => ({ ...c })), ...EXTRA_SHOWCASE];
const sel = document.getElementById('cat');
sel.innerHTML = '<option value="">Todas las categorías</option><option value="__extra">Variantes: guitarras y jarrones</option>' + Object.values(CATEGORIES).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
const cat0 = new URLSearchParams(location.search).get('cat');
if (cat0) sel.value = cat0;

let root = null, pickables = [];
function labelSprite(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.6)'; x.fillRect(0, 0, 512, 96);
  x.fillStyle = color; x.fillRect(0, 88, 512, 8);
  x.fillStyle = '#fff'; x.font = 'bold 34px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text.slice(0, 30), 256, 44);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(0.8, 0.15, 1); s.renderOrder = 5;
  return s;
}
function build() {
  if (root) scene.remove(root);
  root = new THREE.Group(); scene.add(root); pickables = [];
  const q = document.getElementById('q').value.toLowerCase();
  const only = new URLSearchParams(location.search).get('id')?.split(',');
  const list = only ? all.filter(it => only.includes(it.id)) : all.filter(it => (sel.value === '__extra' ? it.extra : sel.value ? it.category === sel.value && !it.extra : !it.extra) && (!q || it.name.toLowerCase().includes(q) || it.id.includes(q)));
  const cols = Math.ceil(Math.sqrt(list.length * 1.4));
  const S = 1.3;
  list.forEach((it, i) => {
    const x = (i % cols) * S, z = Math.floor(i / cols) * S;
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.52, 0.04, 40), floorMat);
    pad.position.set(x, -0.02, z); pad.receiveShadow = true; root.add(pad);
    let m;
    try { m = buildItem(it.id, 7); } catch (e) { console.error(it.id, e); return; }
    // normaliza al tamaño de la celda si es muy grande
    const bb = new THREE.Box3().setFromObject(m), sz = bb.getSize(new THREE.Vector3());
    const k = Math.min(1, 0.9 / Math.max(sz.x, sz.z), 1.6 / sz.y);
    m.scale.multiplyScalar(k);
    m.position.set(x, 0, z);
    root.add(m);
    const lb = labelSprite(it.name, RARITIES[it.rarity]?.color || '#888');
    lb.position.set(x, Math.min(1.7, sz.y * k) + 0.18, z); root.add(lb);
    m.userData.info = it;
    pickables.push(m);
  });
  document.getElementById('count').textContent = `${list.length} objetos`;
  const w = cols * S, d = Math.ceil(list.length / cols) * S;
  controls.target.set(w / 2 - S / 2, 0.3, d / 2 - S / 2);
  camera.position.set(w / 2 - S / 2, Math.max(1.6, w * 0.5), d + Math.max(1.2, w * 0.3));
  if (only && list.length === 1) { camera.position.set(w / 2 - S / 2 + 0.6, 1.1, d / 2 + 1.1); controls.target.set(w / 2 - S / 2, 0.5, d / 2 - S / 2); }
  controls.update();
}
sel.onchange = build;
document.getElementById('q').oninput = build;
build();

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables, true)[0];
  if (!hit) { tip.style.display = 'none'; return; }
  let o = hit.object; while (o && !o.userData.info) o = o.parent;
  const it = o.userData.info;
  tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px';
  tip.innerHTML = `<b>${it.name}</b><small>${it.id} · ${RARITIES[it.rarity]?.name ?? ''} · $${(it.baseValue ?? 0).toLocaleString('es-MX')}</small><small>${it.desc ?? ''}</small>`;
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
